# Render 部署配置 — 免费 Web Service（带后端 + SQLite）
# 在 Render 控制台新建 "Blueprint" 或 "Web Service" 时指向本仓库即可自动读取。
services:
  - type: web
    name: meeting-room-name-voting
    runtime: node
    plan: free
    region: oregon          # 可选：singapore / oregon / frankfurt
    branch: main
    buildCommand: "node -v"  # 零外部依赖，无需 npm install
    startCommand: "node server/index.js"
    healthCheckPath: /api/activity
    envVars:
      - key: PORT
        value: "10000"       # Render 注入的端口
      - key: NODE_ENV
        value: "production"
      - key: ADMIN_PASSWORD
        sync: false          # 部署后在 Render 环境变量面板自行填写
      - key: SESSION_SECRET
        sync: false          # 部署后在 Render 环境变量面板自行填写
